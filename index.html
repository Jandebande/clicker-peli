<!DOCTYPE html>
<html lang="fi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rouble Clicker</title><link rel="stylesheet" href="style.css"></head>
<body><main class="game"><h1>Rouble Clicker</h1>
<section class="balance"><h2 id="roubles">0 ₽</h2><p>Ruplat</p></section>
<button id="clickButton" class="coin" aria-label="Klikkaa ja ansaitse ruplia">₽</button><p>Klikkaa ruplaa ansaitaksesi!</p>
<section id="eventBox" class="event"><h2 id="eventTitle">₿ Bitcoin Event</h2><p id="eventInfo">Odota harvinaista tapahtumaa...</p><p id="timer"></p></section>
<section class="shop"><h2>Kauppa</h2>
<div class="upgrade"><div><h3>Rouble Upgrade - tier 1</h3><p>+1 ₽ per klikkaus</p><p>Hinta: 50 ₽</p></div><button id="buy1">Osta</button></div>
<div class="upgrade"><div><h3>Rouble Upgrade - tier 2</h3><p>+5 ₽ per klikkaus</p><p>Hinta: 250 ₽</p></div><button id="buy2">Osta</button></div>
<div class="upgrade"><div><h3>Rouble Upgrade - tier 3</h3><p>+25 ₽ per klikkaus</p><p>Hinta: 1000 ₽</p></div><button id="buy3">Osta</button></div></section>
<button id="resetButton" class="reset">Aloita uusi peli</button></main><script src="script.js"></script></body></html>
